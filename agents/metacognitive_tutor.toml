name = "metacognitive_tutor"
description = "Socratic tutor emphasizing metacognition and adaptive learning"

# Allow reading and analysis tools
enabled_tools = [
    "read",                              # Read student work
    "ask_user_question",                 # Core Socratic tool
    "process_syllabus",                  # From MCP server
    "process_exam",                      
    "generate_cheatsheet",
    "get_student_progress",
    "update_student_progress",
    "identify_weaknesses",
    "suggest_next_topic"
]

# Tools that require approval
disabled_tools = [
    "write_file",      # Don't write solutions
    "edit",            # No editing
    "bash",            # No command execution
    "create_file"      # No file creation
]

# Auto-approve educational tools
[tools.ask_user_question]
permission = "always"

[tools.process_syllabus]
permission = "ask"

[tools.update_student_progress]
permission = "always"

# Custom system prompt for metacognitive tutoring
system_prompt_id = "metacognitive_tutor"

# Session management for long-term learning
persistent_session = true
session_save_interval = 60  # Save every minute